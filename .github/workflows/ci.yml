name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@1.5.2
      - run: npm test
      - run: npm pack --dry-run
